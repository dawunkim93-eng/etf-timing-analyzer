name: ETF 데이터 갱신

# 하루 한 번만 갱신한다 (22:10 UTC = 다음날 07:10 KST).
#   - 미국 장 마감(21:00 UTC · 서머타임 20:00 UTC) 이후라 미국 종가가 확정된 뒤다
#   - 한국 장 마감(06:30 UTC)도 이미 지나 있어 두 시장 종가가 모두 반영된다
#   - 한국 장 시작(09:00 KST) 전이라 아침에 열면 그날 최신 상태로 보인다
#
# 예전에는 장중 30분 간격으로 돌렸지만, 이 도구의 매수·매도 조건은 일봉·주봉
# 종가 기준이라 장중 갱신이 판단을 바꾸지 않았다. 대신 하루 40~50회 실행과
# 커밋이 쌓여 저장소 이력만 늘었다. 하루 1회로 줄인다.
#
# 공개 저장소여야 Actions 무료 한도(월 2,000분)에 걸리지 않는다.

on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 시세·지표 수집
        run: |
          pip install -r requirements.txt
          python scripts/fetch_etf.py all

      - name: 데이터 무결성 검사
        run: python scripts/validate_data.py

      - name: 백테스트 갱신
        run: python scripts/backtest.py --refresh

      - name: 캐시 무효화
        run: python scripts/cache_bust.py

      - name: 변화 없으면 커밋 생략
        id: check
        run: |
          # updated_at 타임스탬프만 바뀐 경우(장외·주말)는 커밋하지 않는다.
          # history.json 에 새 날짜가 추가된 경우만 예외로 커밋한다.
          if [ -z "$(git status --porcelain -- data/history.json)" ]; then
            jq -S 'del(.updated_at, .updated_at_kst)' data/etf_us.json > /tmp/new_us.json
            jq -S 'del(.updated_at, .updated_at_kst)' data/etf_kr.json > /tmp/new_kr.json
            git show HEAD:data/etf_us.json 2>/dev/null | jq -S 'del(.updated_at, .updated_at_kst)' > /tmp/old_us.json || echo '{}' > /tmp/old_us.json
            git show HEAD:data/etf_kr.json 2>/dev/null | jq -S 'del(.updated_at, .updated_at_kst)' > /tmp/old_kr.json || echo '{}' > /tmp/old_kr.json
            if cmp -s /tmp/new_us.json /tmp/old_us.json && cmp -s /tmp/new_kr.json /tmp/old_kr.json; then
              echo "실질 변경 없음 — 커밋 생략"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 커밋
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_us.json data/etf_kr.json data/history.json data/backtest.json data/depth.json data/score.json
          git commit -m "chore: ETF 데이터 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)\ KST)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 실패 — 재시도 ($attempt)"
            git pull --rebase --autostash || true
            sleep $((attempt * 5))
          done
          echo "::warning::push 에 실패했습니다."
