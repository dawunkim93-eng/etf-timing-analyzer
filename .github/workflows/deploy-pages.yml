name: GitHub Pages 배포

# 정적 파일만 있는 저장소라 Pages 배포가 곧 최종 배포다.
# 데이터 갱신 커밋이 main 에 반영될 때마다 자동으로 다시 배포된다.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "scripts/cache_bust.py"
      - "styles.css"
      - "data/etf_us.json"
      - "data/etf_kr.json"
      - "data/backtest.json"
      - "data/depth.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 캐시 무효화 (내용 해시를 쿼리에)
        run: python scripts/cache_bust.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
